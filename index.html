<meta name="theme-color" content="#0A1220" media="(prefers-color-scheme: dark)">

<style>
  /* ============================================================
     TOKENS — white card, navy accent, cool blue-grey neutrals.
     ============================================================ */
  :root {
    --paper:      #F2F5F9;
    --surface:    #FFFFFF;
    --ink:        #14233B;
    --muted:      #5D6C82;
    --accent:     #1B3A6B;
    --accent-fill:#1B3A6B;
    --accent-ink: #FFFFFF;
    --rule:       #D8E0EA;
    --rule-soft:  #E8EDF3;
    --shadow:     0 1px 2px rgba(20, 35, 59, .06), 0 14px 36px -14px rgba(20, 35, 59, .22);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:      #0A1220;
      --surface:    #101B2D;
      --ink:        #E8EDF5;
      --muted:      #8E9DB4;
      --accent:     #7FA9E0;
      --accent-fill:#2C5AA0;
      --accent-ink: #FFFFFF;
      --rule:       #24344B;
      --rule-soft:  #1A2739;
      --shadow:     0 1px 2px rgba(0, 0, 0, .45), 0 14px 36px -14px rgba(0, 0, 0, .7);
    }
  }

  /* The viewer's explicit toggle must win over the OS preference, both ways. */
  :root[data-theme="light"] {
    --paper:      #F2F5F9;
    --surface:    #FFFFFF;
    --ink:        #14233B;
    --muted:      #5D6C82;
    --accent:     #1B3A6B;
    --accent-fill:#1B3A6B;
    --accent-ink: #FFFFFF;
    --rule:       #D8E0EA;
    --rule-soft:  #E8EDF3;
    --shadow:     0 1px 2px rgba(20, 35, 59, .06), 0 14px 36px -14px rgba(20, 35, 59, .22);
  }

  :root[data-theme="dark"] {
    --paper:      #0A1220;
    --surface:    #101B2D;
    --ink:        #E8EDF5;
    --muted:      #8E9DB4;
    --accent:     #7FA9E0;
    --accent-fill:#2C5AA0;
    --accent-ink: #FFFFFF;
    --rule:       #24344B;
    --rule-soft:  #1A2739;
    --shadow:     0 1px 2px rgba(0, 0, 0, .45), 0 14px 36px -14px rgba(0, 0, 0, .7);
  }

  :root {
    /* Leads with the finest serifs each platform has; Times New Roman is the
       baseline everyone falls back to. */
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
             "Book Antiqua", Georgia, "Times New Roman", Times, serif;
  }

  /* ============================================================
     GROUND
     ============================================================ */
  body {
    min-height: 100dvh;
    margin: 0;
    padding: clamp(1.25rem, 5vw, 3rem) 1.25rem calc(2.5rem + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: var(--serif);
    color: var(--ink);
    background: var(--paper);
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 24.5rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: clamp(1.75rem, 7vw, 2.375rem) clamp(1.5rem, 6vw, 2rem);
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  /* ============================================================
     PORTRAIT — plain circle inside a single offset ring
     ============================================================ */
  .portrait-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .portrait {
    position: relative;
    width: 8.25rem;
    height: 8.25rem;
    flex: none;
  }

  .portrait::after {
    content: "";
    position: absolute;
    inset: -0.5rem;
    border: 1px solid var(--rule);
    border-radius: 50%;
    pointer-events: none;
  }

  .portrait img,
  .portrait .monogram {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    background: var(--paper);
  }

  /* Fallback until a real headshot.jpg sits next to this file. */
  .monogram {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-indent: 0.06em;
    border: 1px solid var(--rule-soft);
  }

  /* `hidden` must beat the display rules set above. */
  .portrait img[hidden],
  .portrait .monogram[hidden] { display: none; }

  /* ============================================================
     NAME
     ============================================================ */
  .identity {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.625rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 9vw, 2.4rem);
    font-weight: 400;
    letter-spacing: 0.005em;
    line-height: 1.1;
    text-wrap: balance;
  }

  .flourish {
    width: 2.25rem;
    height: 1px;
    background: var(--accent);
    opacity: .55;
    margin: 0.125rem 0;
  }

  .role {
    margin: 0;
    font-size: 1rem;
    font-style: italic;
    line-height: 1.45;
    color: var(--ink);
    text-wrap: balance;
  }

  .school {
    margin: 0;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  .actions { display: flex; flex-direction: column; gap: 0.5rem; }

  .btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-height: 3.25rem;
    padding: 0 1.25rem;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1rem;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: border-color .15s ease, transform .12s ease, background-color .15s ease;
  }

  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn--primary {
    background: var(--accent-fill);
    border-color: var(--accent-fill);
    color: var(--accent-ink);
    justify-content: center;
    letter-spacing: 0.03em;
  }
  .btn--primary:hover { filter: brightness(1.1); border-color: var(--accent-fill); }

  .btn svg { flex: none; width: 1.0625rem; height: 1.0625rem; }
  .btn .chev { margin-left: auto; opacity: .4; width: .7rem; height: .7rem; }

  /* ============================================================
     CONTACT ROWS
     ============================================================ */
  .details {
    border-top: 1px solid var(--rule-soft);
    display: flex;
    flex-direction: column;
  }

  .row {
    display: grid;
    grid-template-columns: 5rem 1fr;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.875rem 0;
    border-bottom: 1px solid var(--rule-soft);
    text-decoration: none;
    color: inherit;
  }

  .row:last-child { border-bottom: 0; }

  .row dt {
    margin: 0;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  .row dd {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.4;
    word-break: break-word;
  }

  a.row dd { color: var(--accent); }
  a.row:hover dd { text-decoration: underline; text-underline-offset: 3px; }
  a.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot {
    margin: 0;
    font-size: 1.125rem;
    line-height: 1;
    text-align: center;
    opacity: .9;
  }

  /* ============================================================
     LOAD SEQUENCE
     ============================================================ */
  @keyframes rise {
    from { opacity: 0; transform: translateY(0.5rem); }
    to   { opacity: 1; transform: none; }
  }

  .card > * { animation: rise .55s cubic-bezier(.2, .7, .3, 1) backwards; }
  .card > *:nth-child(1) { animation-delay: .04s; }
  .card > *:nth-child(2) { animation-delay: .13s; }
  .card > *:nth-child(3) { animation-delay: .20s; }
  .card > *:nth-child(4) { animation-delay: .27s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
