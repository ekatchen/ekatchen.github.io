<title>Estela Katchen — Contact Card</title>

<style>
  /* ============================================================
     TOKENS — warm paper, oxblood accent, red-biased neutrals.
     ============================================================ */
  :root {
    --paper:      #FBF8F7;
    --surface:    #FFFFFF;
    --ink:        #241C1E;
    --muted:      #6E605F;
    --accent:     #7A2E3C;
    --accent-fill:#7A2E3C;
    --accent-ink: #FFFFFF;
    --rule:       #E3D9D6;
    --rule-soft:  #EFE8E6;
    --shadow:     0 1px 2px rgba(36, 28, 30, .05), 0 14px 36px -14px rgba(36, 28, 30, .20);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:      #171214;
      --surface:    #211A1C;
      --ink:        #F2EAE9;
      --muted:      #A99695;
      --accent:     #E0A6AF;
      --accent-fill:#8E3644;
      --accent-ink: #FDF7F7;
      --rule:       #3A2E31;
      --rule-soft:  #2C2325;
      --shadow:     0 1px 2px rgba(0, 0, 0, .45), 0 14px 36px -14px rgba(0, 0, 0, .7);
    }
  }

  /* The viewer's explicit toggle must win over the OS preference, both ways. */
  :root[data-theme="light"] {
    --paper:      #FBF8F7;
    --surface:    #FFFFFF;
    --ink:        #241C1E;
    --muted:      #6E605F;
    --accent:     #7A2E3C;
    --accent-fill:#7A2E3C;
    --accent-ink: #FFFFFF;
    --rule:       #E3D9D6;
    --rule-soft:  #EFE8E6;
    --shadow:     0 1px 2px rgba(36, 28, 30, .05), 0 14px 36px -14px rgba(36, 28, 30, .20);
  }

  :root[data-theme="dark"] {
    --paper:      #171214;
    --surface:    #211A1C;
    --ink:        #F2EAE9;
    --muted:      #A99695;
    --accent:     #E0A6AF;
    --accent-fill:#8E3644;
    --accent-ink: #FDF7F7;
    --rule:       #3A2E31;
    --rule-soft:  #2C2325;
    --shadow:     0 1px 2px rgba(0, 0, 0, .45), 0 14px 36px -14px rgba(0, 0, 0, .7);
  }

  :root {
    /* Leads with the finest serifs each platform has; Times New Roman is the
       baseline everyone falls back to. */
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
             "Book Antiqua", Georgia, "Times New Roman", Times, serif;
  }

  /* ============================================================
     GROUND
     ============================================================ */
  body {
    min-height: 100dvh;
    margin: 0;
    padding: clamp(1.25rem, 5vw, 3rem) 1.25rem calc(2.5rem + env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: var(--serif);
    color: var(--ink);
    background: var(--paper);
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 24.5rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: clamp(1.75rem, 7vw, 2.375rem) clamp(1.5rem, 6vw, 2rem);
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  /* ============================================================
     PORTRAIT — plain circle inside a single offset ring
     ============================================================ */
  .portrait-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .portrait {
    position: relative;
    width: 8.25rem;
    height: 8.25rem;
    flex: none;
  }

  .portrait::after {
    content: "";
    position: absolute;
    inset: -0.5rem;
    border: 1px solid var(--rule);
    border-radius: 50%;
    pointer-events: none;
  }

  .portrait img,
  .portrait .monogram {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center 20%;
    border-radius: 50%;
    background: var(--paper);
  }

  /* Fallback until a real headshot.jpg sits next to this file. */
  .monogram {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--accent);
    text-indent: 0.06em;
    border: 1px solid var(--rule-soft);
  }

  .portrait img[hidden] { display: none; }

  /* ============================================================
     NAME
     ============================================================ */
  .identity {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.625rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2rem, 9vw, 2.4rem);
    font-weight: 400;
    letter-spacing: 0.005em;
    line-height: 1.1;
    text-wrap: balance;
  }

  .flourish {
    width: 2.25rem;
    height: 1px;
    background: var(--accent);
    opacity: .55;
    margin: 0.125rem 0;
  }

  .role {
    margin: 0;
    font-size: 1rem;
    font-style: italic;
    line-height: 1.45;
    color: var(--ink);
    text-wrap: balance;
  }

  .school {
    margin: 0;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
  }

  /* ============================================================
     ACTIONS
     ============================================================ */
  .actions { display: flex; flex-direction: column; gap: 0.5rem; }

  .btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    min-height: 3.25rem;
    padding: 0 1.25rem;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1rem;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: border-color .15s ease, transform .12s ease, background-color .15s ease;
  }

  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn--primary {
    background: var(--accent-fill);
    border-color: var(--accent-fill);
    color: var(--accent-ink);
    justify-content: center;
    letter-spacing: 0.03em;
  }
  .btn--primary:hover { filter: brightness(1.1); border-color: var(--accent-fill); }

  .btn svg { flex: none; width: 1.0625rem; height: 1.0625rem; }
  .btn .chev { margin-left: auto; opacity: .4; width: .7rem; height: .7rem; }

  /* ============================================================
     CONTACT ROWS
     ============================================================ */
  .details {
    border-top: 1px solid var(--rule-soft);
    display: flex;
    flex-direction: column;
  }

  .row {
    display: grid;
    grid-template-columns: 5rem 1fr;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0.875rem 0;
    border-bottom: 1px solid var(--rule-soft);
    text-decoration: none;
    color: inherit;
  }

  .row:last-child { border-bottom: 0; }

  .row dt {
    margin: 0;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  .row dd {
    margin: 0;
    font-size: 0.9375rem;
    line-height: 1.4;
    word-break: break-word;
  }

  a.row dd { color: var(--accent); }
  a.row:hover dd { text-decoration: underline; text-underline-offset: 3px; }
  a.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .foot {
    margin: 0;
    font-size: 0.6875rem;
    font-style: italic;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-align: center;
  }

  /* Toast for the vCard save */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(1.5rem + env(safe-area-inset-bottom));
    transform: translate(-50%, 1rem);
    background: var(--ink);
    color: var(--paper);
    font-size: 0.875rem;
    padding: 0.6875rem 1.0625rem;
    border-radius: 3px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 10;
  }
  .toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }

  /* ============================================================
     LOAD SEQUENCE
     ============================================================ */
  @keyframes rise {
    from { opacity: 0; transform: translateY(0.5rem); }
    to   { opacity: 1; transform: none; }
  }

  .card > * { animation: rise .55s cubic-bezier(.2, .7, .3, 1) backwards; }
  .card > *:nth-child(1) { animation-delay: .04s; }
  .card > *:nth-child(2) { animation-delay: .13s; }
  .card > *:nth-child(3) { animation-delay: .20s; }
  .card > *:nth-child(4) { animation-delay: .27s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>

<main class="card">

  <div class="portrait-block">
    <div class="portrait">
      <!-- Drop a square headshot.jpg beside this file and it replaces the monogram. -->
      <img id="headshot" src="headshot.jpg" alt="Estela Katchen" hidden>
      <div class="monogram" id="monogram" aria-hidden="true">EK</div>
    </div>

    <div class="identity">
      <h1>Estela Katchen</h1>
      <div class="flourish" aria-hidden="true"></div>
      <p class="role">Mechatronic Systems Engineering &amp; Business Administration</p>
      <p class="school">Western University &middot; Ivey Business School</p>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn--primary" id="save-contact" type="button">
      Save to contacts
    </button>

    <a class="btn" href="https://www.linkedin.com/in/estela-katchen/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-.95 1.83-1.95 3.77-1.95 4.03 0 4.78 2.5 4.78 5.76V21h-4v-5.6c0-1.34-.03-3.06-1.9-3.06-1.9 0-2.2 1.46-2.2 2.96V21H9z"/>
      </svg>
      LinkedIn
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </a>

    <a class="btn" href="resume.pdf" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M9 13h6M9 17h6"/>
      </svg>
      Résumé
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </a>
  </div>

  <dl class="details">
    <a class="row" href="mailto:estelakatchen@icloud.com">
      <dt>Email</dt>
      <dd>estelakatchen@icloud.com</dd>
    </a>
    <a class="row" href="tel:+14168898190">
      <dt>Phone</dt>
      <dd>(416) 889-8190</dd>
    </a>
    <div class="row">
      <dt>Based in</dt>
      <dd>Toronto, Ontario</dd>
    </div>
  </dl>

  <p class="foot">Lovely to meet you.</p>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  /* ---- Headshot: show the photo only if it actually loads ---- */
  (function () {
    var img = document.getElementById('headshot');
    var mono = document.getElementById('monogram');
    function reveal() {
      img.hidden = false;
      mono.style.display = 'none';
    }
    img.addEventListener('load', reveal);
    if (img.complete && img.naturalWidth > 0) reveal();
    // If it 404s, the monogram simply stays.
  })();

  /* ---- vCard ---- EDIT HERE if your details change ---- */
  var VCARD = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:Katchen;Estela;;;',
    'FN:Estela Katchen',
    'TITLE:Mechatronic Systems Engineering & HBA Candidate',
    'ORG:Western University — Ivey Business School',
    'EMAIL;TYPE=INTERNET,PREF:estelakatchen@icloud.com',
    'TEL;TYPE=CELL,VOICE:+14168898190',
    'ADR;TYPE=HOME:;;;Toronto;ON;;Canada',
    'URL:https://www.linkedin.com/in/estela-katchen/',
    'END:VCARD'
  ].join('\r\n');

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.dataset.show = 'true';
    clearTimeout(t._timer);
    t._timer = setTimeout(function () { t.dataset.show = 'false'; }, 2600);
  }

  document.getElementById('save-contact').addEventListener('click', function () {
    try {
      var blob = new Blob([VCARD], { type: 'text/vcard;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Estela-Katchen.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast('Contact card downloaded — open it to add.');
    } catch (e) {
      toast('Could not save. Email: estelakatchen@icloud.com');
    }
  });
</script>
